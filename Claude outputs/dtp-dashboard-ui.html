<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Дашборд ДТП — макет интерфейса</title>
<style>
/* ==========================================================================
   Дизайн-токены — те же, что в проекте (src/app/styles/theme.css).
   Тёмная тема по умолчанию; без ручного выбора тема берётся из системы.
   ========================================================================== */
:root,
[data-theme='dark'] {
  --color-bg: #0a0a0b;
  --color-surface: #17171a;
  --color-surface-2: #1f1f23;
  --color-border: #2a2a2f;
  --color-text: #f4f4f5;
  --color-text-secondary: #97979f;
  --color-accent: #f5a623;
  --color-positive: #22c55e;
  --color-negative: #ef4444;
  --color-on-accent: #1a1206;
  --color-chart-1: #3987e5;
  --color-chart-2: #d95926;
  --color-chart-3: #199e70;
  --color-chart-4: #c98500;
  --color-chart-5: #d55181;
  --shadow-pop: 0 12px 40px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

[data-theme='light'] {
  --color-bg: #f5f6f8;
  --color-surface: #ffffff;
  --color-surface-2: #eef0f3;
  --color-border: #dcdfe4;
  --color-text: #17181c;
  --color-text-secondary: #63676f;
  --color-accent: #2f5fe0;
  --color-positive: #1f9d5a;
  --color-negative: #d93636;
  --color-on-accent: #ffffff;
  --color-chart-1: #2a78d6;
  --color-chart-2: #eb6834;
  --color-chart-3: #1baf7a;
  --color-chart-4: #eda100;
  --color-chart-5: #e87ba4;
  --shadow-pop: 0 12px 40px rgba(20, 24, 40, 0.18);
  color-scheme: light;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --color-bg: #f5f6f8;
    --color-surface: #ffffff;
    --color-surface-2: #eef0f3;
    --color-border: #dcdfe4;
    --color-text: #17181c;
    --color-text-secondary: #63676f;
    --color-accent: #2f5fe0;
    --color-positive: #1f9d5a;
    --color-negative: #d93636;
    --color-on-accent: #ffffff;
    --color-chart-1: #2a78d6;
    --color-chart-2: #eb6834;
    --color-chart-3: #1baf7a;
    --color-chart-4: #eda100;
    --color-chart-5: #e87ba4;
    --shadow-pop: 0 12px 40px rgba(20, 24, 40, 0.18);
    color-scheme: light;
  }
}

:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-sans: 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}

/* ==========================================================================
   Сброс и база
   ========================================================================== */
* { box-sizing: border-box; }
* { scrollbar-color: var(--color-border) var(--color-surface); scrollbar-width: thin; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: var(--color-surface); }
*::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 8px; }
*::-webkit-scrollbar-thumb:hover { background: var(--color-text-secondary); }

html, body { margin: 0; }
body {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-text);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
h1, h2, h3 { margin: 0 0 var(--space-3); font-weight: 600; }
p { margin: 0; }
button, input, select { font: inherit; }
button { color: inherit; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* «Скелет» — заглушка вместо данных */
.sk {
  display: inline-block;
  height: 10px;
  border-radius: 5px;
  background: var(--color-border);
  opacity: 0.75;
  vertical-align: middle;
}

/* ==========================================================================
   Каркас: сайдбар + колонка контента
   ========================================================================== */
.wrapper { display: flex; min-height: 100svh; background: var(--color-bg); }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  padding: var(--space-4) var(--space-3);
  height: 100svh;
  position: sticky;
  top: 0;
  align-self: flex-start;
  transition: transform 0.2s ease;
}

.brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-2) var(--space-5); }
.logo {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--color-accent); color: var(--color-accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 9px; letter-spacing: -0.3px; flex-shrink: 0;
}
.brand-name { font-weight: 600; font-size: 14px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-link {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 10px var(--space-3);
  border-radius: var(--radius-sm);
  color: var(--color-text-secondary);
  text-decoration: none; font-size: 14px;
  transition: background-color 0.15s, color 0.15s;
}
.nav-link svg { flex-shrink: 0; }
.nav-link:hover { color: var(--color-text); background: var(--color-surface-2); }
.nav-link.is-active, .nav-link.is-active:hover {
  color: var(--color-on-accent); background: var(--color-accent); font-weight: 600;
}

.sidebar-foot {
  margin-top: auto;
  padding: var(--space-3) var(--space-2) 0;
  border-top: 1px solid var(--color-border);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
}
.sidebar-note { font-size: 11px; line-height: 1.4; color: var(--color-text-secondary); }
.theme-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; flex-shrink: 0;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: transparent; color: var(--color-text-secondary); cursor: pointer;
}
.theme-btn:hover { color: var(--color-text); background: var(--color-surface-2); }
.theme-btn .i-sun { display: none; }
:root[data-theme='dark'] .theme-btn .i-sun { display: block; }
:root[data-theme='dark'] .theme-btn .i-moon { display: none; }

.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); z-index: 20; }

.content-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main { flex: 1; min-width: 0; padding: var(--space-5); }

/* ==========================================================================
   Верхняя панель
   ========================================================================== */
.topbar {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface);
  flex-wrap: wrap;
}
.icon-btn {
  display: none; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: transparent; color: var(--color-text); cursor: pointer;
}
.period-group { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.select {
  padding: 8px var(--space-3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: var(--color-surface-2);
  color: var(--color-text);
  font-size: 13px;
  cursor: pointer;
}
.spacer { flex: 1; }
.action-btn {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 8px var(--space-3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: transparent; color: var(--color-text);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.action-btn:hover:not(:disabled) { background: var(--color-surface-2); }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.logout {
  padding: 8px var(--space-3);
  border-radius: var(--radius-sm);
  border: none; background: transparent;
  color: var(--color-text-secondary); font-size: 13px; cursor: pointer;
}
.logout:hover { color: var(--color-negative); }
@keyframes spin { to { transform: rotate(360deg); } }
.is-spinning svg { animation: spin 0.9s linear infinite; }

/* ==========================================================================
   Страницы
   ========================================================================== */
.page { display: flex; flex-direction: column; gap: var(--space-4); }
.page-title { margin: 0; font-size: 18px; font-weight: 600; }

/* --- KPI-карточки ------------------------------------------------------- */
.kpi-row { display: grid; gap: var(--space-3); }
.kpi-row.cols-5 { grid-template-columns: repeat(5, 1fr); }
.kpi-row.cols-4 { grid-template-columns: repeat(4, 1fr); }

.kpi {
  position: relative;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0;
  transition: border-color 0.15s, background-color 0.15s;
}
.kpi:has(.kpi-main.is-btn:hover),
.kpi:has(.kpi-main.is-btn:focus-visible),
.kpi:has(.kpi-main.is-plain:hover) {
  border-color: var(--color-accent);
  background: var(--color-surface-2);
}
.kpi:has(.kpi-main.is-btn:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.kpi-main {
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0; padding: 0; margin: 0;
  border: 0; background: none; color: inherit; font: inherit; text-align: left;
  cursor: pointer;
}
.kpi-main.is-btn:focus-visible { outline: none; }

.kpi-label {
  font-size: 12px; line-height: 16px; min-height: 32px;
  padding-right: 32px;
  color: var(--color-text-secondary);
}
.kpi-value {
  font-size: 22px; line-height: 1.25; font-weight: 600;
  color: var(--color-text);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.kpi-delta { font-size: 12px; line-height: 16px; color: var(--color-text-secondary); }

.kpi-list-btn {
  position: absolute; top: 10px; right: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-2);
  color: var(--color-accent);
  cursor: pointer;
  transition: border-color 0.15s, background-color 0.15s;
}
.kpi-list-btn:hover { border-color: var(--color-accent); }

/* --- Карточка графика ---------------------------------------------------- */
.chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  min-width: 0;
}
.card-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: var(--space-2); margin-bottom: var(--space-3);
}
.card-title { font-size: 13px; font-weight: 600; margin: 0; }
.toggle {
  flex-shrink: 0;
  padding: 2px 8px;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: transparent; color: var(--color-text-secondary);
  font-size: 11px; cursor: pointer; white-space: nowrap;
}
.toggle:hover, .toggle[aria-pressed='true'] { border-color: var(--color-accent); color: var(--color-text); }

.chart-body { height: 268px; }
.plot {
  display: grid;
  grid-template-columns: 44px 1fr;
  grid-template-rows: 240px 28px;
  column-gap: 8px;
  height: 100%;
}
.y-axis { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; padding: 0; }
.y-axis .sk { height: 8px; }
.plot-area { position: relative; border-left: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); }
.plot-area svg { display: block; width: 100%; height: 100%; }
.x-axis { grid-column: 2; display: flex; align-items: center; justify-content: space-around; gap: 4px; }
.x-axis .sk { height: 8px; }

.grid-line { stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.ghost { color: var(--color-chart-1); }
.ghost-line {
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-dasharray: 6 6; stroke-opacity: 0.75;
  vector-effect: non-scaling-stroke; stroke-linecap: round;
}
.ghost-area { fill: currentColor; opacity: 0.1; }
.ghost-bar {
  fill: currentColor; fill-opacity: 0.2;
  stroke: currentColor; stroke-opacity: 0.7; stroke-width: 1.5; stroke-dasharray: 4 4;
  vector-effect: non-scaling-stroke;
}
.donut-wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
.donut-wrap svg { height: 240px; width: 240px; max-width: 100%; }
.ghost-seg { fill: none; stroke: currentColor; stroke-opacity: 0.32; stroke-width: 30; }
.ghost-seg-edge { fill: none; stroke: currentColor; stroke-opacity: 0.8; stroke-width: 1.5; stroke-dasharray: 4 4; }

.legend {
  display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start;
  gap: var(--space-1) var(--space-4);
  height: 40px; overflow: hidden; margin-top: var(--space-2);
}
.legend-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; line-height: 18px; color: var(--color-text-secondary); white-space: nowrap;
}
.legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* Табличная альтернатива графику («Показать данные») */
.chart-table-wrap { height: 268px; overflow: auto; }

/* --- Таблицы ------------------------------------------------------------- */
.table-grid { display: grid; gap: var(--space-3); }
.table-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.table-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

.table-card { min-height: 390px; display: flex; flex-direction: column; }
.table-card .card-header { align-items: center; min-height: 40px; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; padding: var(--space-2);
  color: var(--color-text-secondary); font-weight: 500;
  border-bottom: 1px solid var(--color-border); white-space: nowrap;
}
.table td {
  padding: var(--space-2); height: 37px;
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}
.table .center { text-align: center; }
.table tbody tr.is-click { cursor: pointer; }
.table tbody tr.is-click:hover td { background: var(--color-surface-2); }
.table tbody tr.is-click:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.chart-table-wrap .table th { position: sticky; top: 0; background: var(--color-surface); }
.chart-table-wrap .table th:not(:first-child),
.chart-table-wrap .table td:not(:first-child) { text-align: right; }
.chart-table-wrap .table td { height: 34px; }

/* --- Аналитика: две группы KPI ------------------------------------------ */
.groups { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); align-items: stretch; }
.group { display: flex; flex-direction: column; min-width: 0; border-top: 3px solid transparent; padding-top: var(--space-3); }
.group-title { font-size: 13px; font-weight: 600; margin-bottom: var(--space-2); }
.group-row {
  flex: 1; display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 1fr; gap: var(--space-3);
}

/* --- Модальное окно со списком ДТП -------------------------------------- */
.backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
  display: flex; align-items: center; justify-content: center;
  padding: var(--space-4); z-index: 50;
}
.dialog {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  width: min(1200px, 100%); max-height: 90vh;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: var(--shadow-pop);
}
.dialog-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-border);
}
.dialog-title { font-size: 16px; font-weight: 600; margin: 0; }
.dialog-sub { font-size: 13px; color: var(--color-text-secondary); margin: 4px 0 0; }
.close-btn {
  border: none; background: transparent; color: var(--color-text-secondary);
  font-size: 16px; cursor: pointer; padding: var(--space-1) var(--space-2);
}
.close-btn:hover { color: var(--color-text); }
.toolbar {
  display: flex; gap: var(--space-3);
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--color-border);
}
.search {
  flex: 1; min-width: 0; padding: 8px var(--space-3);
  border-radius: var(--radius-sm); border: 1px solid var(--color-border);
  background: var(--color-surface-2); color: var(--color-text); font-size: 13px;
}
.search::placeholder { color: var(--color-text-secondary); }
.dialog-table-wrap { overflow: auto; flex: 1; }
.dialog-table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
.dialog-table th {
  position: sticky; top: 0; background: var(--color-surface);
  text-align: left; padding: var(--space-2) var(--space-3);
  color: var(--color-text-secondary); font-weight: 500;
  border-bottom: 1px solid var(--color-border);
}
.dialog-table td { padding: var(--space-2) var(--space-3); height: 41px; border-bottom: 1px solid var(--color-border); }
.dialog-table tbody tr:hover td { background: var(--color-surface-2); }
.row-expand {
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  border: 1px solid var(--color-border); background: transparent;
  color: var(--color-text-secondary); cursor: pointer; font-size: 11px; line-height: 1;
}
.row-expand:hover { color: var(--color-text); background: var(--color-surface-2); }

/* --- Тост ---------------------------------------------------------------- */
.toast {
  position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: 60;
  background: var(--color-surface-2); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-4);
  font-size: 13px; box-shadow: var(--shadow-pop);
  opacity: 0; transform: translateY(8px); pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.is-on { opacity: 1; transform: translateY(0); }

/* ==========================================================================
   Экран входа
   ========================================================================== */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100svh; padding: 16px; }
.login-form {
  width: 100%; max-width: 360px;
  display: flex; flex-direction: column; gap: 16px;
  padding: 32px; border-radius: var(--radius-md);
  background: var(--color-surface); border: 1px solid var(--color-border);
}
.login-brand { display: flex; justify-content: center; margin-bottom: 4px; }
.login-brand .logo { width: 48px; height: 48px; font-size: 13px; }
.login-title { font-size: 20px; margin: 0 0 8px; text-align: center; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; color: var(--color-text-secondary); }
.input {
  width: 100%; padding: 10px 12px;
  border-radius: var(--radius-sm); border: 1px solid var(--color-border);
  background: var(--color-bg); color: inherit; font-size: 15px;
}
.input::placeholder { color: var(--color-text-secondary); opacity: 0.7; }
.input:focus-visible { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 25%, transparent); }
.pw { position: relative; }
.pw .input { padding-right: 44px; }
.pw-toggle {
  position: absolute; top: 0; right: 0; height: 100%; width: 42px;
  border: 0; background: transparent; color: var(--color-text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.pw-toggle:hover { color: var(--color-text); }
.submit {
  padding: 12px; border-radius: var(--radius-sm); border: none;
  background: var(--color-accent); color: var(--color-on-accent);
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.submit:hover { filter: brightness(1.06); }

/* ==========================================================================
   Адаптив
   ========================================================================== */
@media (max-width: 1200px) {
  .kpi-row.cols-5 { grid-template-columns: repeat(3, 1fr); }
  .table-grid.cols-3 { grid-template-columns: 1fr; }
  .groups { grid-template-columns: 1fr; }
  .group-row { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 960px) {
  .icon-btn { display: flex; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 30;
    transform: translateX(-100%);
    box-shadow: 2px 0 16px rgba(0, 0, 0, 0.3);
  }
  .sidebar.is-open { transform: translateX(0); }
  .chart-grid, .table-grid.cols-2 { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .main { padding: var(--space-3); }
  .topbar { padding: var(--space-2) var(--space-3); }
  .action-label { display: none; }
  .kpi-row.cols-5, .kpi-row.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .group-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-value { font-size: 18px; }
  .plot { grid-template-columns: 36px 1fr; }
  .toolbar { padding: var(--space-3); }

}

}

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------------
     Мелкие помощники
     ------------------------------------------------------------------------ */
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  var ICON_LIST =
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><circle cx="4.5" cy="6" r="0.8"/><circle cx="4.5" cy="12" r="0.8"/><circle cx="4.5" cy="18" r="0.8"/></svg>';

  // Цвета серий. Для сравнения автоколонн: 1-я — chart-1, 2-я — chart-2.
  var C1 = 'var(--color-chart-1)', C2 = 'var(--color-chart-2)', C3 = 'var(--color-chart-3)';

  // Ширина «скелета» — детерминированная, чтобы макет не «прыгал» при перерисовке
  var SK_W = [72, 56, 84, 62, 78, 50, 68, 74, 58, 80];
  var sk = function (i, min, max) {
    var w = min + ((SK_W[i % SK_W.length] - 50) / 34) * (max - min);
    return '<span class="sk" style="width:' + Math.round(w) + '%"></span>';
  };

  /* ------------------------------------------------------------------------
     Заглушки графиков: сетка, оси-«скелеты», пунктирные фигуры без цифр
     ------------------------------------------------------------------------ */
  var W = 600, H = 240;

  function smooth(pts) {
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      var c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ' C' + c1[0].toFixed(1) + ',' + c1[1].toFixed(1) + ' ' + c2[0].toFixed(1) + ',' + c2[1].toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
    }
    return d;
  }

  function gridLines() {
    var s = '';
    for (var i = 1; i < 5; i++) s += '<line class="grid-line" x1="0" x2="' + W + '" y1="' + (H * i / 4) + '" y2="' + (H * i / 4) + '"/>';
    return s;
  }

  function toPoints(vals) {
    var n = vals.length;
    return vals.map(function (v, i) { return [(i + 0.5) * (W / n), H - v * (H - 24) - 12]; });
  }

  var SHAPES = {
    a: [0.42, 0.5, 0.38, 0.55, 0.62, 0.48, 0.58, 0.7, 0.52, 0.64, 0.76, 0.6],
    b: [0.3, 0.36, 0.44, 0.34, 0.4, 0.5, 0.42, 0.46, 0.58, 0.44, 0.52, 0.48],
    c: [0.55, 0.42, 0.5, 0.36, 0.46, 0.58, 0.5, 0.4, 0.48, 0.6, 0.54, 0.62]
  };

  function lineSvg(series) {
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + gridLines();
    series.forEach(function (s, idx) {
      var pts = toPoints(SHAPES[s.shape]);
      var d = smooth(pts);
      if (idx === 0 && series.length === 1) {
        out += '<path class="ghost-area" style="color:' + s.color + '" d="' + d + ' L' + pts[pts.length - 1][0] + ',' + H + ' L' + pts[0][0] + ',' + H + ' Z"/>';
      }
      out += '<path class="ghost-line" style="color:' + s.color + '" d="' + d + '"/>';
    });
    return out + '</svg>';
  }

  // series: [{color, vals:[0..1,...]}] — группы столбцов
  function barsSvg(groups, series) {
    var g = groups, k = series.length;
    var slot = W / g, bw = Math.min(slot * 0.62 / k, 64);
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + gridLines();
    for (var i = 0; i < g; i++) {
      var x0 = i * slot + (slot - bw * k) / 2;
      series.forEach(function (s, j) {
        var h = s.vals[i % s.vals.length] * (H - 20);
        out += '<rect class="ghost-bar" style="color:' + s.color + '" x="' + (x0 + j * bw).toFixed(1) + '" y="' + (H - h).toFixed(1) + '" width="' + (bw - 3).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3"/>';
      });
    }
    return out + '</svg>';
  }

  function donutSvg(colors) {
    var r = 70, c = 2 * Math.PI * r, fr = [0.5, 0.32, 0.18], off = 0, out = '';
    out += '<svg viewBox="0 0 200 200" aria-hidden="true">';
    colors.forEach(function (col, i) {
      var len = c * fr[i] - 4;
      out += '<circle class="ghost-seg" style="color:' + col + '" cx="100" cy="100" r="' + r + '" transform="rotate(-90 100 100)" stroke-dasharray="' + len.toFixed(1) + ' ' + (c - len).toFixed(1) + '" stroke-dashoffset="' + (-off).toFixed(1) + '"/>';
      off += c * fr[i];
    });
    out += '<circle class="ghost-seg-edge" style="color:var(--color-text-secondary)" cx="100" cy="100" r="85"/>';
    out += '<circle class="ghost-seg-edge" style="color:var(--color-text-secondary)" cx="100" cy="100" r="55"/>';
    return out + '</svg>';
  }

  function axes(bodyHtml, xn, yn) {
    var y = '', x = '', i;
    for (i = 0; i < (yn || 5); i++) y += '<span class="sk" style="width:' + (i % 2 ? 26 : 32) + 'px"></span>';
    for (i = 0; i < xn; i++) x += '<span class="sk" style="width:' + (xn > 8 ? 22 : 56) + 'px"></span>';
    return '<div class="plot"><div class="y-axis">' + y + '</div><div class="plot-area">' + bodyHtml + '</div><div class="x-axis">' + x + '</div></div>';
  }

  function chartBody(spec) {
    switch (spec.kind) {
      case 'line':
        return axes(lineSvg([{ color: spec.colors ? spec.colors[0] : C1, shape: 'a' }]), 12);
      case 'lines2':
        return axes(lineSvg([{ color: spec.colors ? spec.colors[0] : C1, shape: 'a' }, { color: spec.colors ? spec.colors[1] : C2, shape: 'b' }]), 12);
      case 'bars':
        return axes(barsSvg(spec.groups, [{ color: C1, vals: [0.74, 0.5, 0.38, 0.62, 0.3] }]), spec.groups);
      case 'grouped':
        return axes(barsSvg(spec.groups, [
          { color: spec.colors ? spec.colors[0] : C1, vals: [0.7, 0.46, 0.58, 0.34, 0.5] },
          { color: spec.colors ? spec.colors[1] : C2, vals: [0.56, 0.38, 0.44, 0.28, 0.4] }
        ]), spec.groups);
      case 'donut':
        return '<div class="donut-wrap">' + donutSvg([C1, C2, C3]) + '</div>';
    }
    return '';
  }

  function legendHtml(items) {
    return '<div class="legend">' + (items || []).map(function (it) {
      return '<span class="legend-item"><span class="legend-swatch" style="background:' + it.color + '"></span>' + esc(it.label) + '</span>';
    }).join('') + '</div>';
  }

  function tableSkeleton(cols, rows, opts) {
    opts = opts || {};
    var head = '<tr>' + cols.map(function (c, i) {
      return '<th' + (opts.center && i > 0 ? ' class="center"' : '') + '>' + esc(c) + '</th>';
    }).join('') + '</tr>';
    var body = '';
    for (var r = 0; r < rows; r++) {
      body += '<tr' + (opts.click ? ' class="is-click" tabindex="0" data-open="1"' : '') + '>' + cols.map(function (c, i) {
        var cell = i === 0 && !opts.rank ? sk(r, 45, 88) : (i === 0 && opts.rank ? sk(r, 20, 40) : sk(r + i, 34, 64));
        return '<td' + (opts.center && i > 0 ? ' class="center"' : '') + '>' + cell + '</td>';
      }).join('') + '</tr>';
    }
    return '<table class="table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  }

  /* ------------------------------------------------------------------------
     Компоненты страниц
     ------------------------------------------------------------------------ */
  function kpiCard(o) {
    // o: {label, deltaText, nav:{label, route}, list:'Заголовок списка'}
    var summary = o.label + ': —';
    var main;
    if (o.nav) {
      main = '<button type="button" class="kpi-main is-btn" data-nav="' + o.nav.route + '" aria-label="' + esc(summary + '. ' + o.nav.label) + '">';
    } else {
      main = '<div class="kpi-main is-plain" data-open-list="' + esc(o.list) + '">';
    }
    main +=
      '<span class="kpi-label">' + esc(o.label) + '</span>' +
      '<span class="kpi-value">—</span>' +
      '<span class="kpi-delta">' + (o.deltaText ? esc(o.deltaText) : '&nbsp;') + '</span>' +
      (o.nav ? '</button>' : '</div>');
    var title = [o.tip, o.nav ? 'Клик по карточке — ' + o.nav.label : ''].filter(Boolean).join('\n');
    return '<div class="kpi"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + main +
      '<button type="button" class="kpi-list-btn" data-open-list="' + esc(o.list) + '" title="Показать таблицу ДТП" aria-label="' + esc(o.label + ': показать таблицу ДТП') + '">' + ICON_LIST + '</button></div>';
  }

  var chartSeq = 0;
  function chartCard(spec) {
    var id = 'ch' + (++chartSeq);
    var cols = spec.cols;
    var tbl = '<div class="chart-table-wrap" hidden>' + tableSkeleton(cols, 6, {}) + '</div>';
    return '<section class="card chart-card" aria-labelledby="' + id + '">' +
      '<div class="card-header"><h3 class="card-title" id="' + id + '">' + esc(spec.title) + '</h3>' +
      '<button type="button" class="toggle" aria-pressed="false" data-toggle-table>Показать данные</button></div>' +
      '<div class="chart-view"><div class="chart-body">' + chartBody(spec) + '</div>' + legendHtml(spec.legend) + '</div>' +
      tbl + '</section>';
  }

  function dataTable(spec) {
    var rows = spec.expandTo ? 5 : spec.rows;
    return '<section class="card table-card" data-rows="' + rows + '" data-max="' + (spec.expandTo || rows) + '">' +
      '<div class="card-header"><h3 class="card-title">' + esc(spec.title) + '</h3>' +
      (spec.expandTo ? '<button type="button" class="toggle" data-expand>Показать все</button>' : '') + '</div>' +
      '<div class="table-wrap">' + tableSkeleton(spec.cols, rows, { center: true, click: !!spec.click, rank: spec.rank }) + '</div></section>';
  }

  var LEG_FAULT = [{ label: 'Вина водителя', color: C1 }, { label: 'Вина третьей стороны', color: C2 }, { label: 'Без повреждений', color: C3 }];
  var LEG_DMG = [{ label: 'Ущерб', color: C1 }, { label: 'Возмещение', color: C2 }];
  var LEG_AB = [{ label: 'Автоколонна 1', color: C1 }, { label: 'Автоколонна 2', color: C2 }];
  var COLS_MONTH = ['Месяц', 'ДТП'];
  var COLS_MONTH_DMG = ['Месяц', 'Ущерб', 'Возмещение'];
  var COLS_CAUSE = ['Категория', 'ДТП', 'Доля'];
  var COLS_CAUSE_DMG = ['Категория', 'Ущерб', 'Возмещение'];

  /* ------------------------------------------------------------------------
     Экраны
     ------------------------------------------------------------------------ */
  function pageOverview() {
    chartSeq = 0;
    var period = 'выбранный период';
    var kpis = [
      { label: 'Всего ДТП', deltaText: '— к пред. периоду', tip: 'Общее число ДТП за период', nav: { label: 'переход к статистике по автоколонне', route: '/motorcade' }, list: 'Все ДТП — ' + period },
      { label: 'Общая сумма ущерба', deltaText: '— к пред. периоду', tip: 'Совокупный финансовый эффект ДТП — основа ремонтного бюджета', nav: { label: 'переход к аналитике', route: '/analytics' }, list: 'ДТП с ущербом — ' + period },
      { label: 'Сумма возмещения', deltaText: '— к пред. периоду', tip: 'Сколько из ущерба фактически покрыто виновником/страховой', nav: { label: 'переход к аналитике', route: '/analytics' }, list: 'ДТП с возмещением — ' + period },
      { label: 'Доля возмещения', deltaText: '— к пред. периоду', tip: 'Возмещено ÷ ущерб. Низкое значение — сигнал юридическому отделу', nav: { label: 'переход к аналитике', route: '/analytics' }, list: 'ДТП, возмещённые не полностью — ' + period },
      { label: 'Средний ущерб на 1 ДТП', deltaText: '— к пред. периоду', tip: 'Тяжесть одного инцидента: ущерб ÷ число ДТП с ущербом', nav: { label: 'переход к аналитике', route: '/analytics' }, list: 'ДТП с ущербом — ' + period }
    ];
    return '<div class="page">' +
      '<div class="kpi-row cols-5">' + kpis.map(kpiCard).join('') + '</div>' +
      '<div class="chart-grid">' + [
        chartCard({ title: 'Динамика ДТП по месяцам', kind: 'line', legend: [{ label: 'ДТП', color: C1 }], cols: COLS_MONTH }),
        chartCard({ title: 'Структура причин ДТП', kind: 'donut', legend: LEG_FAULT, cols: COLS_CAUSE }),
        chartCard({ title: 'ДТП по автоколоннам', kind: 'bars', groups: 4, legend: [], cols: ['Автоколонна', 'ДТП'] }),
        chartCard({ title: 'Ущерб и возмещение по автоколоннам', kind: 'grouped', groups: 4, legend: LEG_DMG, cols: ['Автоколонна', 'Ущерб', 'Возмещение'] }),
        chartCard({ title: 'Ущерб и возмещение по категориям причин', kind: 'grouped', groups: 3, legend: LEG_DMG, cols: COLS_CAUSE_DMG }),
        chartCard({ title: 'Динамика ущерба и возмещения по месяцам', kind: 'lines2', legend: LEG_DMG, cols: COLS_MONTH_DMG })
      ].join('') + '</div>' +
      '<div class="table-grid cols-3">' + [
        dataTable({ title: 'Топ-8 водителей по числу ДТП', cols: ['Водитель', 'ДТП', 'Ущерб'], rows: 8, expandTo: 8, click: true }),
        dataTable({ title: 'Топ-8 автобусов по числу ДТП', cols: ['ТС', 'ДТП', 'Ущерб'], rows: 8, expandTo: 8, click: true }),
        dataTable({ title: 'Ущерб и возмещение по категориям причин', cols: ['Категория', 'ДТП', 'Ущерб', 'Возмещение'], rows: 5, click: true })
      ].join('') + '</div></div>';
  }

  function pageMotorcade() {
    chartSeq = 0;
    var period = 'выбранный период';
    var k = function (label, tip, list, delta) { return { label: label, tip: tip, list: list + ' — ' + period, deltaText: delta === false ? '' : '— к пред. периоду' }; };
    var kpis = [
      k('Количество ДТП', 'Масштаб аварийности автоколонны', 'Все ДТП'),
      k('Сумма ущерба', 'Финансовый эффект ДТП этой автоколонны', 'ДТП с ущербом'),
      k('Сумма возмещения', 'Насколько эффективно автоколонна взыскивает ущерб', 'ДТП с возмещением'),
      k('Доля возмещения', 'Качество претензионной работы. Сравнимо между автоколоннами', 'ДТП, возмещённые не полностью'),
      k('Средний ущерб на 1 ДТП', 'Типичная тяжесть инцидента в этой автоколонне', 'ДТП с ущербом'),
      k('Доля ДТП по вине водителя', 'Ключевой показатель управляемого риска', 'ДТП по вине водителя'),
      k('Доля ДТП по вине третьей стороны', 'Аварии вне контроля водителей автоколонны', 'ДТП по вине третьей стороны'),
      k('Доля ДТП без повреждений', 'Доля инцидентов без материального ущерба', 'ДТП без повреждений')
    ];
    return '<div class="page">' +
      '<h1 class="page-title">Название автоколонны</h1>' +
      '<div class="kpi-row cols-4">' + kpis.map(kpiCard).join('') + '</div>' +
      '<div class="chart-grid">' + [
        chartCard({ title: 'Динамика ДТП по месяцам', kind: 'line', legend: [{ label: 'ДТП', color: C1 }], cols: COLS_MONTH }),
        chartCard({ title: 'Структура причин ДТП', kind: 'donut', legend: LEG_FAULT, cols: COLS_CAUSE }),
        chartCard({ title: 'Ущерб и возмещение по категориям причин', kind: 'grouped', groups: 3, legend: LEG_DMG, cols: COLS_CAUSE_DMG }),
        chartCard({ title: 'Динамика ущерба и возмещения по месяцам', kind: 'lines2', legend: LEG_DMG, cols: COLS_MONTH_DMG })
      ].join('') + '</div>' +
      '<div class="table-grid cols-3">' + [
        dataTable({ title: 'Топ-8 водителей по числу ДТП', cols: ['Водитель', 'ДТП', 'Ущерб'], rows: 8, expandTo: 8, click: true }),
        dataTable({ title: 'Топ-8 автобусов по числу ДТП', cols: ['ТС', 'ДТП', 'Ущерб'], rows: 8, expandTo: 8, click: true }),
        dataTable({ title: 'Ущерб и возмещение по категориям причин', cols: ['Категория', 'ДТП', 'Ущерб', 'Возмещение'], rows: 5, click: true })
      ].join('') + '</div></div>';
  }

  function analyticsGroup(name, color, isB) {
    var period = 'выбранный период';
    var d = isB ? '— к Автоколонне 1' : '';
    var list = function (t) { return t + ' — ' + name + ', ' + period; };
    var cards = [
      { label: 'Количество ДТП', tip: 'Масштаб аварийности автоколонны', list: list('Все ДТП'), deltaText: d },
      { label: 'Сумма ущерба', tip: 'Финансовый эффект ДТП этой автоколонны', list: list('ДТП с ущербом'), deltaText: d },
      { label: 'Доля возмещения', tip: 'Качество претензионной работы. Сравнимо между автоколоннами', list: list('ДТП, возмещённые не полностью'), deltaText: d },
      { label: 'Средний ущерб на 1 ДТП', tip: 'Типичная тяжесть инцидента в этой автоколонне', list: list('ДТП с ущербом'), deltaText: d }
    ];
    return '<div class="group" style="border-top-color:' + color + '">' +
      '<div class="group-title" style="color:' + color + '">' + esc(name) + '</div>' +
      '<div class="group-row">' + cards.map(kpiCard).join('') + '</div></div>';
  }

  function pageAnalytics() {
    chartSeq = 0;
    return '<div class="page">' +
      '<div class="groups">' + analyticsGroup('Автоколонна 1', C1, false) + analyticsGroup('Автоколонна 2', C2, true) + '</div>' +
      '<div class="chart-grid">' + [
        chartCard({ title: 'Сравнение структуры причин ДТП', kind: 'grouped', groups: 3, legend: LEG_AB, cols: ['Категория', 'Автоколонна 1', 'Автоколонна 2'] }),
        chartCard({ title: 'Средний ущерб на 1 ДТП', kind: 'bars', groups: 2, legend: [], cols: ['Автоколонна', 'Средний ущерб'] }),
        chartCard({ title: 'Сумма ущерба и возмещения', kind: 'grouped', groups: 2, legend: LEG_DMG, cols: ['Автоколонна', 'Ущерб', 'Возмещение'] }),
        chartCard({ title: 'Динамика ДТП по месяцам', kind: 'lines2', legend: LEG_AB, cols: ['Месяц', 'Автоколонна 1', 'Автоколонна 2'] }),
        chartCard({ title: 'Динамика суммы ущерба по месяцам', kind: 'lines2', legend: LEG_AB, cols: ['Месяц', 'Автоколонна 1', 'Автоколонна 2'] }),
        chartCard({ title: 'Динамика суммы возмещения по месяцам', kind: 'lines2', legend: LEG_AB, cols: ['Месяц', 'Автоколонна 1', 'Автоколонна 2'] }),
        chartCard({ title: 'Водителей с 3 и более ДТП', kind: 'bars', groups: 2, legend: [], cols: ['Автоколонна', 'Водителей'] })
      ].join('') + '</div>' +
      '<div class="table-grid cols-2">' + [
        dataTable({ title: 'Сводное сравнение показателей', cols: ['Показатель', 'Автоколонна 1', 'Автоколонна 2', 'Разница'], rows: 7 }),
        dataTable({ title: 'Топ-10 худших водителей (обе автоколонны)', cols: ['#', 'Водитель', 'Автоколонна', 'ДТП', 'Ущерб', 'Доля «вина водителя»'], rows: 10, click: true, rank: true })
      ].join('') + '</div></div>';
  }

  /* ------------------------------------------------------------------------
     Фильтры верхней панели (набор зависит от экрана)
     ------------------------------------------------------------------------ */
  var state = { mode: 'month' };
  var PERIOD_HINT = { month: 'Выберите месяц', quarter: 'Выберите квартал', year: 'Выберите год' };

  function filtersHtml(route) {
    var h = '<select class="select" id="f-mode" aria-label="Гранулярность периода">' +
      [['month', 'Месяц'], ['quarter', 'Квартал'], ['year', 'Год'], ['all', 'Весь период']].map(function (o) {
        return '<option value="' + o[0] + '"' + (state.mode === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select>';
    if (state.mode !== 'all') {
      h += '<select class="select" id="f-period" aria-label="Период"><option>' + PERIOD_HINT[state.mode] + '</option></select>';
    }
    if (route === '/motorcade') {
      h += '<select class="select" aria-label="Автоколонна"><option>Выберите автоколонну</option></select>';
    }
    if (route === '/analytics') {
      h += '<select class="select" aria-label="Автоколонна 1"><option>Автоколонна 1</option></select>' +
           '<select class="select" aria-label="Автоколонна 2"><option>Автоколонна 2</option></select>';
    }
    return h;
  }

  /* ------------------------------------------------------------------------
     Роутинг по hash: #/  #/motorcade  #/analytics  #/login
     ------------------------------------------------------------------------ */
  var PAGES = {
    '/': { title: 'Обзор', render: pageOverview },
    '/motorcade': { title: 'Статистика по автоколонне', render: pageMotorcade },
    '/analytics': { title: 'Аналитика', render: pageAnalytics }
  };

  var viewLogin = $('#view-login'), viewApp = $('#view-app'), main = $('#main');
  var currentRoute = null;

  function parseRoute() {
    var h = (location.hash || '').replace(/^#/, '').split('?')[0];
    if (!h || h === '/') return '/';
    return h;
  }

  function route() {
    var r = parseRoute();
    if (r === '/login') {
      viewApp.hidden = true;
      viewLogin.hidden = false;
      document.title = 'Вход — Дашборд ДТП';
      closeMenu();
      return;
    }
    if (!PAGES[r]) { location.replace('#/'); return; }

    viewLogin.hidden = true;
    viewApp.hidden = false;

    if (r !== currentRoute) {
      currentRoute = r;
      main.innerHTML = PAGES[r].render();
      $('#filters').innerHTML = filtersHtml(r);
      window.scrollTo(0, 0);
    }
    $$('.nav-link').forEach(function (a) {
      var on = a.getAttribute('data-route') === r;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = PAGES[r].title + ' — Дашборд ДТП';
    closeMenu();
  }

  window.addEventListener('hashchange', route);

  /* ------------------------------------------------------------------------
     Сайдбар на мобильных
     ------------------------------------------------------------------------ */
  var sidebar = $('#sidebar'), overlay = $('#overlay');
  function openMenu() { sidebar.classList.add('is-open'); overlay.hidden = false; }
  function closeMenu() { sidebar.classList.remove('is-open'); overlay.hidden = true; }
  $('#menu-btn').addEventListener('click', openMenu);
  overlay.addEventListener('click', closeMenu);

  /* ------------------------------------------------------------------------
     Тема
     ------------------------------------------------------------------------ */
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  try {
    var saved = localStorage.getItem('dtp-mock-theme');
    if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) { /* хранилище недоступно — тема просто не запомнится */ }
  // Явно выставляем атрибут, чтобы CSS-переключатель иконок работал в любом режиме
  if (!document.documentElement.getAttribute('data-theme')) document.documentElement.setAttribute('data-theme', currentTheme());

  $('#theme-btn').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('dtp-mock-theme', next); } catch (e) { /* не критично */ }
  });

  /* ------------------------------------------------------------------------
     Модальное окно «Список ДТП»
     ------------------------------------------------------------------------ */
  var backdrop = $('#backdrop'), lastFocus = null;
  var DIALOG_COLS = ['', 'Дата/время', 'Автоколонна', 'ТС', 'Водитель', 'Маршрут', 'Адрес', 'Причина', 'Виновник', 'Ущерб', 'Возмещение', 'Статус', 'Страховая', 'Пострадавшие'];

  // ширина «скелета» в px, а не %, — иначе колонки схлопываются
  function buildDialogTable() {
    var head = '<thead><tr>' + DIALOG_COLS.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead>';
    var body = '<tbody>';
    for (var r = 0; r < 9; r++) {
      body += '<tr>' + DIALOG_COLS.map(function (c, i) {
        if (i === 0) return '<td><button type="button" class="row-expand" aria-label="Показать подробности">▸</button></td>';
        var w = 44 + ((SK_W[(r + i) % SK_W.length] - 50) / 34) * 60;
        return '<td><span class="sk" style="width:' + Math.round(w) + 'px"></span></td>';
      }).join('') + '</tr>';
    }
    return head + body + '</tbody>';
  }
  $('#dialog-table').innerHTML = buildDialogTable();

  function openDialog(title) {
    lastFocus = document.activeElement;
    $('#dialog-title').textContent = title || 'Список ДТП';
    backdrop.hidden = false;
    $('#dialog-close').focus();
  }
  function closeDialog() {
    if (backdrop.hidden) return;
    backdrop.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('#dialog-close').addEventListener('click', closeDialog);
  backdrop.addEventListener('mousedown', function (e) { if (e.target === backdrop) closeDialog(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeDialog(); closeMenu(); }
    // ловушка фокуса внутри диалога
    if (e.key === 'Tab' && !backdrop.hidden) {
      var f = $$('button, input', backdrop).filter(function (el) { return !el.disabled; });
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ------------------------------------------------------------------------
     Тост
     ------------------------------------------------------------------------ */
  var toast = $('#toast'), toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('is-on'); }, 2400);
  }

  /* ------------------------------------------------------------------------
     Делегирование кликов на странице
     ------------------------------------------------------------------------ */
  main.addEventListener('click', function (e) {
    var t = e.target;

    var listBtn = t.closest('[data-open-list]');
    if (listBtn) { openDialog(listBtn.getAttribute('data-open-list')); return; }

    var nav = t.closest('[data-nav]');
    if (nav) { location.hash = '#' + nav.getAttribute('data-nav'); return; }

    var tog = t.closest('[data-toggle-table]');
    if (tog) {
      var card = tog.closest('.chart-card');
      var on = tog.getAttribute('aria-pressed') !== 'true';
      tog.setAttribute('aria-pressed', String(on));
      tog.textContent = on ? 'Показать график' : 'Показать данные';
      $('.chart-view', card).hidden = on;
      $('.chart-table-wrap', card).hidden = !on;
      return;
    }

    var exp = t.closest('[data-expand]');
    if (exp) {
      var tc = exp.closest('.table-card');
      var open = exp.getAttribute('data-open') !== '1';
      var rows = open ? +tc.getAttribute('data-max') : +tc.getAttribute('data-rows');
      var cols = $$('thead th', tc).map(function (th) { return th.textContent; });
      $('.table-wrap', tc).innerHTML = tableSkeleton(cols, rows, { center: true, click: true });
      exp.setAttribute('data-open', open ? '1' : '0');
      exp.textContent = open ? 'Свернуть' : 'Показать все';
      return;
    }

    var row = t.closest('tr[data-open]');
    if (row) {
      var title = $('.card-title', row.closest('.card')).textContent;
      openDialog(title + ' — выбранный период');
    }
  });

  main.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-open]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  /* ------------------------------------------------------------------------
     Верхняя панель: фильтры, обновление, PDF, выход
     ------------------------------------------------------------------------ */
  $('#filters').addEventListener('change', function (e) {
    if (e.target.id === 'f-mode') {
      state.mode = e.target.value;
      $('#filters').innerHTML = filtersHtml(currentRoute);
      $('#f-mode').focus();
    }
  });

  var refreshBtn = $('#refresh-btn'), refreshLabel = $('#refresh-label');
  refreshBtn.addEventListener('click', function () {
    refreshBtn.disabled = true;
    refreshBtn.classList.add('is-spinning');
    refreshLabel.textContent = 'Обновляем…';
    setTimeout(function () {
      refreshBtn.disabled = false;
      refreshBtn.classList.remove('is-spinning');
      refreshLabel.textContent = 'Обновить данные';
      showToast('Макет: данные не подключены');
    }, 1200);
  });

  var pdfBtn = $('#pdf-btn');
  pdfBtn.addEventListener('click', function () {
    pdfBtn.disabled = true;
    showToast('Формирование PDF…');
    setTimeout(function () {
      pdfBtn.disabled = false;
      showToast('Макет: PDF-отчёт не формируется');
    }, 1400);
  });

  $('#logout-btn').addEventListener('click', function () { location.hash = '#/login'; });

  /* ------------------------------------------------------------------------
     Экран входа
     ------------------------------------------------------------------------ */
  var phone = $('#phone');
  phone.addEventListener('input', function () {
    var d = phone.value.replace(/\D/g, '');
    if (d[0] === '8' || d[0] === '7') d = d.slice(1);
    d = d.slice(0, 10);
    var out = '';
    if (d.length || phone.value) out = '+7';
    if (d.length) out += ' (' + d.slice(0, 3);
    if (d.length >= 3) out += ')';
    if (d.length > 3) out += ' ' + d.slice(3, 6);
    if (d.length > 6) out += '-' + d.slice(6, 8);
    if (d.length > 8) out += '-' + d.slice(8, 10);
    phone.value = out;
  });

  var pw = $('#password');
  $('#pw-toggle').addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
  });

  $('#login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    currentRoute = null;
    location.hash = '#/';
  });

  route();
})();
</script>
</body>
</html>
